<!-- MODAL GLOBAL DE ABONO RÁPIDO (EFECTIVO / TRANSFERENCIA / MIXTO) -->
<div id="modalAbonoGlobal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden animate-modal border border-slate-200">
        <div class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
            <div>
                <h3 class="text-lg font-extrabold text-amber-400">💰 Registrar Cobro / Abono</h3>
                <p class="text-xs text-slate-300">Factura <span id="abono_factura_label" class="font-bold text-white"></span> — <span id="abono_cliente_label"></span></p>
            </div>
            <button type="button" onclick="cerrarModal('modalAbonoGlobal')" class="text-slate-400 hover:text-white text-xl font-bold">✕</button>
        </div>

        <form action="/cartera/abonar" method="post" class="p-6 space-y-4">
            <input type="hidden" name="venta_id" id="abono_venta_id">
            <input type="hidden" name="origen" value="{{ request.url.path }}">
            <input type="hidden" id="abono_saldo_max" value="0">

            <!-- Deuda actual destacada -->
            <div class="bg-rose-50 border border-rose-200 rounded-xl p-3.5 flex items-center justify-between">
                <span class="text-sm font-semibold text-rose-800">Deuda Pendiente Actual:</span>
                <span id="abono_saldo_display" class="text-xl font-extrabold text-rose-600">$ 0</span>
            </div>

            <!-- Botones rápidos para un niño de 10 años -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">1. Elige cómo te pagaron (Acción Rápida):</label>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                    <button type="button" onclick="seleccionarModoAbono('EFECTIVO_TOTAL')" class="px-3 py-2.5 rounded-xl bg-emerald-100 hover:bg-emerald-200 text-emerald-900 font-bold text-xs border border-emerald-300 transition">
                        💵 Todo Efectivo
                    </button>
                    <button type="button" onclick="seleccionarModoAbono('TRANSFERENCIA_TOTAL')" class="px-3 py-2.5 rounded-xl bg-blue-100 hover:bg-blue-200 text-blue-900 font-bold text-xs border border-blue-300 transition">
                        📲 Todo Transf.
                    </button>
                    <button type="button" onclick="seleccionarModoAbono('MITAD_Y_MITAD')" class="px-3 py-2.5 rounded-xl bg-indigo-100 hover:bg-indigo-200 text-indigo-900 font-bold text-xs border border-indigo-300 transition">
                        ⚖️ 50% y 50%
                    </button>
                    <button type="button" onclick="seleccionarModoAbono('LIMPIAR')" class="px-3 py-2.5 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold text-xs border border-amber-300 transition">
                        ✏️ Abono Parcial
                    </button>
                </div>
            </div>

            <!-- Campos de Pago Mixto: Efectivo + Transferencia -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="bg-emerald-50/70 p-3.5 rounded-xl border border-emerald-200">
                    <label class="block text-xs font-bold text-emerald-800 mb-1">💵 Recibido en EFECTIVO ($)</label>
                    <input type="number" step="50" min="0" name="monto_efectivo" id="abono_efectivo" oninput="actualizarCalculoAbono()"
                        class="w-full px-3 py-2.5 rounded-lg border border-emerald-300 bg-white font-extrabold text-slate-900 text-base focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <div class="bg-blue-50/70 p-3.5 rounded-xl border border-blue-200">
                    <label class="block text-xs font-bold text-blue-800 mb-1">📲 Recibido TRANSFERENCIA ($)</label>
                    <input type="number" step="50" min="0" name="monto_transferencia" id="abono_transferencia" oninput="actualizarCalculoAbono()"
                        class="w-full px-3 py-2.5 rounded-lg border border-blue-300 bg-white font-extrabold text-slate-900 text-base focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Cuenta / Billetera (si aplica)</label>
                    <select name="entidad_transferencia" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm bg-white">
                        <option value="Nequi">Nequi</option>
                        <option value="Daviplata">Daviplata</option>
                        <option value="Bancolombia">Bancolombia</option>
                        <option value="Efectivo Caja">Solo Efectivo</option>
                        <option value="Otra Transferencia">Otra Transferencia</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Nota opcional</label>
                    <input type="text" name="concepto" placeholder="Ej: Abono quincena..." class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm">
                </div>
            </div>

            <!-- Resumen en vivo y validación instantánea -->
            <div class="bg-slate-100 rounded-xl p-3.5 space-y-1.5 border border-slate-200 text-sm">
                <div class="flex justify-between">
                    <span class="text-slate-600 font-medium">Total a Abonar Ahora:</span>
                    <span id="abono_total_preview" class="font-extrabold text-slate-900">$ 0</span>
                </div>
                <div class="flex justify-between">
                    <span class="text-slate-600 font-medium">Nuevo Saldo Después del Pago:</span>
                    <span id="abono_restante_preview" class="font-bold text-emerald-600">$ 0</span>
                </div>
            </div>

            <div id="abono_error_msg" class="hidden p-3 rounded-xl bg-rose-100 text-rose-800 text-xs font-bold border border-rose-300"></div>

            <div class="flex justify-end gap-3 pt-2">
                <button type="button" onclick="cerrarModal('modalAbonoGlobal')" class="px-4 py-2.5 rounded-xl border border-slate-300 text-slate-700 font-semibold text-sm hover:bg-slate-100">
                    Cancelar
                </button>
                <button type="submit" id="btn_confirmar_abono" class="px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-sm shadow-md transition">
                    ✅ Guardar Pago
                </button>
            </div>
        </form>
    </div>
</div>
