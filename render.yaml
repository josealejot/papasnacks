services:
  - type: web
    name: isaias-papas-erp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: isaias-papas-db
          property: connectionString

databases:
  - name: isaias-papas-db
    plan: free
    databaseName: isaias_papas
    user: isaias_admin
